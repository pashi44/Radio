description: Custom I2C Controller Binding for ESP32 by Binz Vendor
compatible: "binz,custom-i2c"
include: [i2c-controller.yaml ,  base.yaml ] 

properties:
  reg:
    required: true
  clock-frequency:
    type: int
    default: 100000
    description: "I2C clock frequency in Hz."
  sda-gpios:
    type: phandle-array
    required: true
  scl-gpios:
    type: phandle-array
    required: true