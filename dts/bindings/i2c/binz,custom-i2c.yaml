description: Custom I2C Controller Binding for ESP32 by Binz Vendor
compatible: "binz,custom-i2c"
include: espressif,esp32-i2c.yaml 

properties:
  reg:
    type: array
    required: true

  "#address-cells":
    type: int
    description: "Must be 1 cell for I2C 7-bit addressing."
  "#size-cells":
    type: int
    description: "Must be 0 cells for I2C."
child-binding:
  properties:
    custom-id:
      type: string
      description: A custom identifier for the I2C child device.